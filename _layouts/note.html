---
layout: homepage
---
<article class="note-page">
  <header class="note-header">
    <a class="back-link" href="{{ '/notes/' | relative_url }}">← All notes</a>
    <p class="eyebrow">Research note</p>
    <h1>{{ page.title }}</h1>
    <p class="note-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>{% if page.description %} · {{ page.description }}{% endif %}</p>
  </header>
  <div class="note-content">{{ content }}</div>
</article>
